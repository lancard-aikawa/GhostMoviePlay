# GhostMoviePlay — このプロジェクトの既定
#
# ここに置いた値は、下の video.md すべてに効く。**git に入れる。**
# 1本だけ変えたいものは video.md のフロントマターで上書きする。
# いま効いている値と、その由来は `gmp config`（画面なら `gmp ui`）で見られる。

project = 'GhostMoviePlay'

[app]
# 説明ページは静的なので、収録のあいだだけ簡易サーバを立てる。
# file:// の絶対パスを plan.json に焼くと、別のマシンで開けなくなる
url = 'http://127.0.0.1:8765/'
start = 'python -m http.server 8765 --directory docs/video/intro/site'
ready = '#title'
cwd = '.'                      # ソースを読ませるフォルダ (このファイルからの相対)

[voice]
speaker = 'ずんだもん'
style = 'ノーマル'
speed = 1.05

# 読みの指定。用語は動画をまたいで共通なのでここに置く。
# **TOML の裸のキーは ASCII だけ。日本語の表記は必ずクォートする。**
[voice.dict]
'段' = 'ダン'
'尺' = 'シャク'
'層' = 'ソウ'
# 英数字はそのまま読ませると綴りを 1 文字ずつ読む (mp4 -> エムピイヨン)
'mp4' = 'エムピーフォー'
'JSON' = 'ジェイソン'
'URL' = 'ユーアールエル'

[persona]
style = '落ち着いた解説口調。仕組みを順に見せ、なぜそうしたかを一言添える'

[series]
audience = 'このツールを初めて見る人。動画を自動で作りたいが、AI に任せた動画が使い物にならなかった人'
topics = ['ツールの紹介', 'タイル取りゲームの実演']
count = 2
target_seconds = 90.0
avoid = ['未実装の機能', 'まだ無い TTS エンジンの話']

[determinism]
# 全動画で日付表示を揃えるために、開始時刻をプロジェクトで決めておく
time = '2026-01-01T09:00:00'
seed = 12345
